<meta name="description" content="Become a Designer Plan partner — earn up to 35% commission. Sign up with just your email.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="/js/auth.js"></script>
<script>
(function(){
  'use strict';
  function decide(){
    if (window.DP_AUTH && window.DP_AUTH.user) {
      window.location.replace('/dashboard/profile');
    } else {
      window.location.replace('/login');
    }
  }
  if (window.DP_AUTH && window.DP_AUTH.ready) {
    decide();
  } else {
    document.addEventListener('dp-auth-ready', decide, { once: true });
  }
})();
</script>

<style>
  .fallback {
    text-align: center;
    padding: 80px 20px;
  }
  .fallback .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 3px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 700ms linear infinite;
    margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback p { color: var(--ink-65); font-size: 0.95rem; }
</style>
</head>
